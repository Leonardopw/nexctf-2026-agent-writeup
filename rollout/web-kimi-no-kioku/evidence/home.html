<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memento Mori · SSTI</title>
  <style>
    :root {
      --bg0: #04060c;
      --bg1: #0a1224;
      --panel: rgba(12, 20, 38, .78);
      --blue: #2e6fed;
      --blue-bright: #4d8bff;
      --cyan: #79d7ff;
      --text: #edf3fe;
      --muted: #8ca2c6;
      --line: rgba(120, 170, 255, .16);
      --glow: rgba(46, 111, 237, .35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 85% -10%, var(--glow), transparent 60%),
        radial-gradient(900px 600px at -10% 110%, rgba(121, 215, 255, .12), transparent 55%),
        linear-gradient(150deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      background-attachment: fixed;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
      position: relative;
      overflow-x: hidden;
    }

    /* 满月 —— Persona 3 的意象 */
    .moon {
      position: fixed;
      top: -70px;
      right: -70px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #ffffff 0%, #dfe9ff 30%, #a8c4ff 58%, #5b8bff 100%);
      box-shadow: 0 0 90px 30px rgba(120, 170, 255, .28);
      pointer-events: none;
      z-index: 0;
    }

    /* 斜切装饰线 —— P3 UI 的斜角 */
    .slash {
      position: fixed;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 120px 120px;
      border-color: transparent transparent var(--blue) transparent;
      opacity: .5;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(680px, 94vw);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05);
      padding: 34px 32px 30px;
      text-align: center;
      animation: rise .6s ease-out;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: -1px;
      width: 46px;
      height: 46px;
      border-top: 3px solid var(--blue-bright);
      border-left: 3px solid var(--blue-bright);
      border-radius: 18px 0 0 0;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: .5em;
      color: var(--cyan);
      opacity: .85;
      text-transform: uppercase;
    }

    .meme {
      width: min(300px, 74vw);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: 0 0 0 1px rgba(77, 139, 255, .12), 0 14px 40px rgba(0, 0, 0, .5);
      margin: 10px 0 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(18px, 3.6vw, 26px);
      line-height: 1.35;
      letter-spacing: .5px;
      color: var(--text);
    }

    h1 .highlight {
      color: var(--blue-bright);
      text-shadow: 0 0 18px var(--glow);
    }

    .tagline {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .3px;
    }

    .divider {
      height: 1px;
      margin: 0 auto 22px;
      width: min(420px, 80%);
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .output {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(46, 111, 237, .08);
      color: var(--cyan);
      font-size: 15px;
      letter-spacing: .4px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .tip {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      letter-spacing: .2px;
    }

    .tip code {
      color: var(--cyan);
      background: rgba(121, 215, 255, .08);
      padding: 1px 6px;
      border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    @keyframes rise {
      from { transform: translateY(10px); opacity: 0; }
      to   { transform: translateY(0);  opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="moon"></div>
  <div class="slash"></div>

  <main class="card">
    <p class="eyebrow">Memento Mori</p>
    <img class="meme" src="/1.png" alt="结城理">
    <h1>似乎是有点难的<span class="highlight">无回显</span>SSTI</h1>
    <p class="tagline">「正因为死亡无法逃避，活着才有了意义。」</p>
    <div class="divider"></div>
    <span class="output">Hello Guest!</span>
    <p class="tip">传入 <code>?name=YourName</code> 试试看</p>
  </main>
</body>
</html>
